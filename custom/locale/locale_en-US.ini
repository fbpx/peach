features_eyebrow = Why FBPX
features_title = Programs you can read
features_desc = A flow is a graph: plain text you can version, review, and diff like any other source.

feature_name_1 = Flow-as-code
feature_desc_1 = Every application is a .fbp file — a declarative graph of connected nodes. Read, review, and version your architecture like source code.
feature_name_2 = One runtime
feature_desc_2 = A single @fbpx/flow runtime executes every graph identically on the CLI, in a server, or in a browser. No separate execution models.
feature_name_3 = npm is your library
feature_desc_3 = Nodes are plain npm packages behind a tiny protocol — declare dependencies, and compose the ecosystem instead of writing glue code.
feature_name_4 = FBP protocol
feature_desc_4 = Flows speak FBP. Drive and inspect a running graph from any client, and build tools that see the flow as it executes.
feature_name_5 = Deploy & share
feature_desc_5 = Push flows to the registry and reference nodes by URL. fbpx deploy tags a release your projects can consume.
feature_name_6 = Terminal-first
feature_desc_6 = A CLI for the whole lifecycle — run, inspect, convert, compile, install. Scriptable, pipeable, and testable.

