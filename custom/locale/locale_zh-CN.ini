tag_line = 用纯文本 .fbp 文件描述你的应用——把可复用的 npm 包连接成一张图。FBPX 可以在命令行、服务器或浏览器中运行这张图，并通过 FBP 协议实时查看它的执行。
get_started = 开始使用
install = 安装 CLI
graph_label = 流程图
flow_aria = hello_world 流程图：一个 RSS 源地址进入 Rss 节点，解析出每条新闻标题后传给 Log，再传给 SayIt。

features_eyebrow = 为什么选择 FBPX
features_title = 可读的程序
features_desc = 流程图就是一段文本：像任何源码一样，可以版本化、评审和 diff。

feature_name_1 = 流程即代码
feature_desc_1 = 每个应用都是一个 .fbp 文件——由互相连接的节点组成的声明式图形。像源码一样阅读、评审和版本化你的架构。
feature_name_2 = 单一运行时
feature_desc_2 = 一个 @fbpx/flow 运行时在命令行、服务器和浏览器中执行相同的图形，行为完全一致。
feature_name_3 = npm 即你的组件库
feature_desc_3 = 节点就是普通的 npm 包，遵循一份轻量协议。声明依赖，组合整个生态，而不是写胶水代码。
feature_name_4 = FBP 协议
feature_desc_4 = 流程使用 FBP 协议。可以从任意客户端驱动和检查正在运行的图形，让工具看到流程的执行过程。
feature_name_5 = 部署与分享
feature_desc_5 = 把流程推送到仓库，用 URL 引用节点。fbpx deploy 会为你的项目打上 release 标签。
feature_name_6 = 终端优先
feature_desc_6 = 一个 CLI 覆盖整个生命周期——运行、检查、转换、编译、安装。可脚本化、可管道化、可测试。

