{{range .TOC.Nodes}}
  <div class="docs-sidebar__group">
    {{if .Content}}
      <a class="docs-sidebar__group-title" href="{{$.Page.DocsBasePath}}/{{.Path}}">{{.Title}}</a>
    {{else}}
      <span class="docs-sidebar__group-title">{{.Title}}</span>
    {{end}}
    {{if .Nodes}}
      <ul>
        {{range .Nodes}}
          <li>
            {{if eq $.Current .Path}}
              <a href="{{$.Page.DocsBasePath}}/{{.Path}}" aria-current="page">{{.Title}}</a>
            {{else}}
              <a href="{{$.Page.DocsBasePath}}/{{.Path}}">{{.Title}}</a>
            {{end}}
          </li>
        {{end}}
      </ul>
    {{end}}
  </div>
{{end}}
