<!DOCTYPE html>
<html lang="en">
  {{template "common/head" .}}
  <body class="page-404">
    <header class="site-nav">
      <div class="container site-nav__inner">
        <a class="site-nav__logo" href="/">
          <img src="/img/fbpx-canvas.png" alt="FBPX">
          <span>FBPX</span>
        </a>
        <nav aria-label="Main navigation">
          {{template "common/navbar" .}}
        </nav>
      </div>
    </header>

    <main class="page-404__body">
      <div class="page-404__code">4<span>0</span>4</div>
      <p class="page-404__msg">{{call .Tr "status::404_desc"}}</p>
      <a class="btn btn--primary" href="/">{{call .Tr "status::back_home"}}</a>
    </main>
  </body>
</html>
